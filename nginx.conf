events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;
    client_max_body_size 0;

    server {
        listen 80;
        server_name _;

        location / {
            root /usr/share/nginx/html;
            index taskpane.html index.html;
            try_files $uri $uri/ /taskpane.html;
        }

        location /api/ {
            set $office_api_token "";

            if ($http_authorization ~* "^Bearer\s+(.+)$") {
                set $office_api_token $1;
            }
            if ($http_x_api_key != "") {
                set $office_api_token $http_x_api_key;
            }
            if ($http_api_key != "") {
                set $office_api_token $http_api_key;
            }

            if ($office_api_token = "") {
                return 401 "Missing API token.\n";
            }
            if ($office_api_token != "__OFFICEXADD_API_TOKEN__") {
                return 403 "Forbidden: Invalid API token.\n";
            }

            proxy_pass http://backend:5010/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
