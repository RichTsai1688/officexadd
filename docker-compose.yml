version: '3.8'

services:
  backend:
    build: ./backend
    expose:
      - "5010"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_API_KEY=${AI_API_KEY}
      - MODEL_NAME=${MODEL_NAME}
      - OLLAMA_WEB_SEARCH_API_KEY=${OLLAMA_WEB_SEARCH_API_KEY}
      - OLLAMA_WEB_SEARCH_URL=${OLLAMA_WEB_SEARCH_URL}
    volumes:
      - ./backend:/app

  nginx:
    image: nginx:alpine
    depends_on:
      - backend
    environment:
      - OFFICEXADD_API_TOKEN=${OFFICEXADD_API_TOKEN}
      - OFFICEXADD_PUBLIC_ORIGIN=${OFFICEXADD_PUBLIC_ORIGIN}
    ports:
      - "2053:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html
      - ./nginx-start.sh:/docker-entrypoint.d/docker-entrypoint.sh
      - /data2/codespace/ssl_pem/labelnine_domain/certs:/etc/ssl/custom:ro
    command: ["/bin/sh", "/docker-entrypoint.d/docker-entrypoint.sh"]
